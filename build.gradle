plugins {
    id 'io.freefair.lombok' version "${lombokPluginVersion}"
    id 'org.jetbrains.intellij' version "${intellijPluginVersion}"
    id 'java'
    id 'jacoco'
}

// Compatibility shim (AST-193159): accept legacy Jar.baseName used by the SCA resolver.
org.gradle.api.tasks.bundling.Jar.metaClass.setBaseName = { String name -> delegate.archiveBaseName.set(name) }

def javaWrapperVersion = System.getenv('JAVA_WRAPPER_VERSION') ?: defaultJavaWrapperVersion

// Common configuration for all projects
allprojects {
    group "${projectGroup}"
    version System.getenv('RELEASE_VERSION') ?: "dev"

    repositories {

        maven {
            url = "https://maven.echohq.com"
            credentials {
                username = ""
                password = System.getenv('ECHO_LIBRARIES_ACCESS_KEY') ?: ""
            }
        }
        maven {
            url = 'https://packages.jetbrains.team/maven/p/ij/intellij-dependencies'
        }
    }
}

// asm 9.7 comes from the JaCoCo ant task (build tooling only). The root project applies jacoco too,
// so this covers the root and all submodules (AST-194122).
allprojects {
    plugins.withId('jacoco') {
        dependencies {
            constraints {
                ['asm', 'asm-commons', 'asm-tree'].each { module ->
                    jacocoAnt("org.ow2.asm:${module}:${asmVersion}") {
                        because 'CVE-2026-110257/58/60/61/63 in asm 9.7'
                    }
                }
            }
        }
    }
}

// Common configuration for all submodules
subprojects {
    apply plugin: 'java'

    // No toolchain: the SCA resolver container only has JDK 21 and cannot provision JDK 11 (AST-194122).
    // --release pins both the bytecode level and the JDK API surface to Java 11, whatever JDK runs the build.
    def javaRelease = Integer.parseInt(project.property('javaVersion') as String)
    tasks.withType(JavaCompile).configureEach {
        options.release = javaRelease
    }

    // Raise vulnerable transitive test dependencies to the lowest fixed version within the same major (AST-194122)
    dependencies {
        constraints {
            testImplementation("org.assertj:assertj-core:${assertjVersion}") {
                because 'CVE-2026-24400 in 3.17.2, pulled in by remote-robot via assertj-swing'
            }
            testImplementation("org.objenesis:objenesis:${objenesisVersion}") {
                because 'CVE-2026-116486 in 2.6/3.3, pulled in by mockito and awaitility'
            }
        }
    }

    dependencies {
        testImplementation "com.intellij.remoterobot:remote-robot:${remoteRobotVersion}"
        testImplementation("com.intellij.remoterobot:remote-fixtures:${remoteRobotVersion}") {
            exclude group: 'com.square.okio', module: 'okio'
        }
        testImplementation "com.squareup.okio:okio:${okioVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-api:${junitBomVersion}"
        testImplementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
        testImplementation 'junit:junit:4.13.1'
        testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.15.2'

        // Video Recording
        testImplementation('com.automation-remarks:video-recorder-junit5:2.0') {
            exclude group: 'log4j', module: 'log4j'
        }
        testImplementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
        testImplementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitEngineVersion}"

        // https://mvnrepository.com/artifact/com.miglayout/miglayout-swing
        implementation "com.miglayout:miglayout-swing:${miglayoutVersion}"

        implementation("com.checkmarx.ast:ast-cli-java-wrapper:${javaWrapperVersion}"){
            exclude group: 'junit', module: 'junit'
            // Exclude wrapper's Jackson to prevent version conflicts. The enforcedPlatform above will provide aligned versions.
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        }
        implementation(enforcedPlatform("com.fasterxml.jackson:jackson-bom:${jacksonBomVersion}"))
        // enforcedPlatform forces ALL Jackson jars (databind, annotations, core) to use the SAME version,
        // but it only pins versions - it does NOT add any jar to the classpath.
        // Jackson must be declared explicitly so it is packaged in the plugin's lib/ and not
        // taken from the IDE (it is not reliably visible to plugin classloaders - AST-193159).
        implementation "com.fasterxml.jackson.core:jackson-core"
        implementation "com.fasterxml.jackson.core:jackson-databind"
        implementation "com.fasterxml.jackson.core:jackson-annotations"

        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    }

    jacoco {
        toolVersion = "${jacocoVersion}"
    }
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version = "${intellijVersion}"
    updateSinceUntilBuild = false
}

runPluginVerifier {
    ideVersions = verifierIdeVersions.split(',').toList()
}

[verifyPlugin, runPluginVerifier, buildSearchableOptions, patchPluginXml].each {
    tasks.named(it.name) { enabled = false }
}

runIdeForUiTests {
    enabled = false
    dependsOn ':plugin-checkmarx-ast:runIdeForUiTests'
}